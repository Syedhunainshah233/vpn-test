name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout our app
        uses: actions/checkout@v4

      - name: Checkout OpenVPN engine (ics-openvpn, pinned)
        uses: actions/checkout@v4
        with:
          repository: schwabe/ics-openvpn
          ref: 660901ce320539aec476bd04bd1999c396d5e778
          path: ics
          submodules: true

      - name: Install swig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swig

      - name: Use debug signing
        run: mkdir -p ~/.gradle && echo -e "icsopenvpnDebugSign=true\norg.gradle.jvmargs=-Xmx4096M" > ~/.gradle/gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3

      - name: Put our app on top of OpenVPN
        run: bash scripts/patch.sh ics

      - name: Build APK
        working-directory: ics
        run: ./gradlew assembleSkeletonOvpn2Release --no-daemon --stacktrace

      - name: Collect APK
        run: |
          ls -R ics/main/build/outputs/apk | head -40
          APK=$(find ics/main/build/outputs/apk -name '*universal*.apk' | head -1)
          [ -z "$APK" ] && APK=$(find ics/main/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" VPN-Test.apk
          ls -lh VPN-Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VPN-Test-apk
          path: VPN-Test.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: VPN Test (latest build)
          body: "Test APK — OpenVPN engine andar hai, koi doosri app nahi chahiye."
          files: VPN-Test.apk
          make_latest: true
